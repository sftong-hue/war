<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>天下太平 - GenAI 知識挑戰攻防版 (iPad 教學版)</title>
  <style>
    :root {
      --paper-bg: #fbf9f4;
      --line-blue: #c5d8eb;
      --pencil-ink: #222222;
      --pencil-faded: #888888;
      --lead-stroke: #1c1c1c;
      --accent-red: #c0392b;
      --accent-green: #27ae60;
      --accent-orange: #d35400;
      --accent-blue: #2980b9;
      --accent-purple: #8e44ad;
      --p1-theme: #1a5276;
      --p2-theme: #922b21;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* iPad 全螢幕防滾動適配 */
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--paper-bg);
      background-image: 
        linear-gradient(var(--line-blue) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-blue) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
      color: var(--pencil-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      touch-action: manipulation;
    }

    /* 頂部精簡抬頭與選單列 */
    header {
      width: 100%;
      max-width: 740px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
      flex-shrink: 0;
      gap: 8px;
    }

    .title-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    h1 {
      font-size: 1.35rem;
      letter-spacing: 4px;
      color: #1a2a44;
      font-weight: 900;
      line-height: 1;
    }

    .curriculum-pill {
      font-size: 0.72rem;
      background: #eaf2f8;
      color: #2980b9;
      border: 1px solid #aed6f1;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* 精簡下拉選單樣式 */
    .menu-bar {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .select-sketch {
      background: #fff;
      border: 2px solid var(--lead-stroke);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      color: var(--pencil-ink);
      box-shadow: 2px 2px 0 var(--lead-stroke);
      outline: none;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }

    .select-sketch:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--lead-stroke);
    }

    /* 國家自訂名稱輸入條 */
    .names-bar {
      width: 100%;
      max-width: 740px;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.95);
      padding: 3px 12px;
      border-radius: 6px;
      border: 1.5px dashed var(--pencil-faded);
      flex-shrink: 0;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .name-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .name-input {
      font-family: inherit;
      padding: 2px 6px;
      border: 1.5px solid #555;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: bold;
      color: #111;
      width: 110px;
      outline: none;
      background: #fff;
    }

    /* 核心對決手繪畫紙 (適配 iPad 縱向空間) */
    .drawing-sheet {
      width: 100%;
      max-width: 740px;
      height: calc(100dvh - 74px);
      background: #fff;
      border: 3px solid var(--lead-stroke);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: 5px 5px 0px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* 上方陣營 (北方：180度倒置，面對面下筆視角) */
    .territory-top {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: rotate(180deg);
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 3px;
      transition: background 0.25s ease;
      border-radius: 8px;
    }

    /* 下方陣營 (南方：正立己方視角) */
    .territory-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 2px dashed #e2e8f0;
      padding-top: 3px;
      transition: background 0.25s ease;
      border-radius: 8px;
    }

    .territory-top.active-turn {
      background: rgba(254, 226, 226, 0.45);
    }
    .territory-bottom.active-turn {
      background: rgba(219, 234, 254, 0.45);
    }

    .camp-title {
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2px;
    }

    .tier-badge {
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 4px;
      background: #f0f3f6;
      border: 1.2px solid #4a6984;
      font-weight: bold;
      color: #2c3e50;
    }

    .tier-badge.weapon-badge {
      border-color: #8e44ad;
      color: #8e44ad;
      background: #faf4fc;
    }

    .stats-tag {
      font-size: 0.72rem;
      color: #333;
      background: #fff;
      border: 1.2px solid #7f8c8d;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* 三欄排版：【西翼軍火】|【中央要塞與防護罩】|【東翼軍火】 */
    .camp-battle-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .weapon-bay-column {
      width: 80px;
      height: 165px;
      background: rgba(248, 250, 252, 0.7);
      border: 1.5px dashed #aaa;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3px 2px;
      gap: 3px;
      overflow-y: hidden;
    }

    .weapon-bay-header {
      font-size: 0.62rem;
      color: #666;
      font-weight: bold;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #ddd;
      width: 100%;
      text-align: center;
      padding-bottom: 1px;
    }

    .weapon-unit-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.82);
      margin: -3px 0;
    }

    .weapon-tag-pill {
      font-size: 0.58rem;
      font-weight: 900;
      padding: 0 3px;
      border-radius: 2px;
      background: #fff;
      border: 1px solid #111;
      margin-top: -2px;
      box-shadow: 1px 1px 0 #111;
    }

    .weapon-svg {
      filter: drop-shadow(1px 1px 0px rgba(0,0,0,0.25));
    }

    /* 中央要塞舞台 (防護罩全面罩頂覆蓋) */
    .fortress-stage {
      position: relative;
      width: 320px;
      height: 168px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .wall-svg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    /* 田字格堡壘 (高80px) */
    .fortress-box {
      width: 80px;
      height: 80px;
      border: 3px solid var(--lead-stroke);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      position: relative;
      background: #fff;
      z-index: 6;
      margin-bottom: 6px;
    }

    .fortress-box::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(to right, transparent 48%, var(--lead-stroke) 48%, var(--lead-stroke) 52%, transparent 52%),
        linear-gradient(to bottom, transparent 48%, var(--lead-stroke) 48%, var(--lead-stroke) 52%, transparent 52%);
      pointer-events: none;
    }

    .fortress-char {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--lead-stroke);
      position: relative;
      z-index: 7;
    }

    .fortress-char.struck {
      color: #cbd5e1;
    }
    .fortress-char.struck::after {
      content: "✖";
      position: absolute;
      color: var(--accent-red);
      font-size: 1.7rem;
      font-weight: bold;
    }

    /* 旗幟 (插在田字格頂部，高32px) */
    .flags-container {
      position: absolute;
      bottom: 86px;
      width: 80px;
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      z-index: 5;
      pointer-events: none;
    }

    .sketch-flag {
      width: 16px;
      height: 32px;
      position: relative;
      opacity: 0.15;
      filter: grayscale(1);
      transition: all 0.2s;
    }
    .sketch-flag.drawn {
      opacity: 1;
      filter: grayscale(0);
    }
    .sketch-flag .pole {
      width: 2.2px;
      height: 100%;
      background: var(--lead-stroke);
      position: absolute;
      left: 0;
    }
    .sketch-flag .triangle {
      position: absolute;
      top: 0;
      left: 2.2px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 12px solid var(--accent-orange);
    }

    /* =========================================================
       中央交鋒問答區：純粹保留「題目」與「選項」，移除其他裝飾
       ========================================================= */
    .battle-center-divider {
      width: 100%;
      margin: 4px 0;
      background: #f8fafc;
      border: 2.5px solid var(--lead-stroke);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 2px 2px 0 var(--lead-stroke);
      z-index: 10;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }

    /* 輪到北方玩家時旋轉 180° 正對北方視角 */
    .battle-center-divider.flip-to-north {
      transform: rotate(180deg);
      border-color: var(--p2-theme);
    }

    .battle-center-divider.flip-to-south {
      transform: rotate(0deg);
      border-color: var(--p1-theme);
    }

    /* 純粹問答框：僅問題卡片 + 選項 */
    .quiz-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .quiz-question-card {
      background: #ffffff;
      border: 1.8px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    .quiz-question-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.4;
      width: 100%;
    }

    .quiz-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-quiz-opt {
      background: #fff;
      border: 2px solid var(--lead-stroke);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      box-shadow: 1.5px 1.5px 0 var(--lead-stroke);
      transition: all 0.1s;
      min-height: 46px;
      display: flex;
      align-items: center;
      touch-action: manipulation;
      line-height: 1.25;
    }

    .btn-quiz-opt:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    .btn-quiz-opt.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d !important;
    }

    .btn-quiz-opt.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #991b1b !important;
    }

    /* 答對後解鎖的行動面板 */
    .action-panel-inline {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #ecfdf5;
      border: 1.8px solid #059669;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .action-panel-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: #065f46;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .action-btns-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .btn-action-cmd {
      background: #fff;
      border: 2px solid var(--lead-stroke);
      padding: 8px 4px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
      box-shadow: 1.5px 1.5px 0 var(--lead-stroke);
      transition: all 0.1s;
      text-align: center;
      touch-action: manipulation;
    }

    .btn-action-cmd.atk {
      border-color: var(--accent-red);
      color: var(--accent-red);
      box-shadow: 1.5px 1.5px 0 var(--accent-red);
    }
    .btn-action-cmd.build {
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 1.5px 1.5px 0 var(--accent-green);
    }
    .btn-action-cmd:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 結算畫面彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: var(--paper-bg);
      border: 3.5px solid var(--lead-stroke);
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      box-shadow: 6px 6px 0 var(--lead-stroke);
      max-width: 320px;
      width: 90%;
    }
  </style>
</head>
<body>

  <!-- 頂部精簡抬頭：功能全部改為下拉選單 -->
  <header>
    <div class="title-box">
      <h1>天下太平</h1>
      <span class="curriculum-pill">中二 GenAI 攻防</span>
    </div>
    <div class="menu-bar">
      <!-- 遊戲模式下拉選單 -->
      <select id="modeSelect" class="select-sketch" onchange="setMode(this.value)">
        <option value="ai" selected>🤖 單人 vs 電腦</option>
        <option value="pvp">👥 iPad 雙人對決</option>
      </select>

      <!-- 系統功能選單 -->
      <select id="funcSelect" class="select-sketch" onchange="handleFuncSelect(this)">
        <option value="" disabled selected>⚙️ 功能</option>
        <option value="sound">🔊 音效切換 (開/關)</option>
        <option value="reset">🔄 擦乾淨重來</option>
      </select>
    </div>
  </header>

  <!-- 國家名自訂條 -->
  <div class="names-bar">
    <div class="name-input-group">
      <span>北席模型 (上):</span>
      <input type="text" id="p2-name-input" class="name-input" value="DeepBot模型庫" maxlength="9" oninput="updateNames()">
    </div>
    <div class="name-input-group">
      <span>南席模型 (下):</span>
      <input type="text" id="p1-name-input" class="name-input" value="GPT守護者" maxlength="9" oninput="updateNames()">
    </div>
  </div>

  <!-- 核心對決手繪畫紙 (適配 iPad 高度) -->
  <div class="drawing-sheet">

    <!-- 上方陣營 (北方：180度倒置，面對面下筆視角) -->
    <div class="territory-top" id="p2-territory">
      <div class="camp-title">
        <span id="p2-title-label">DeepBot模型庫 (AI)</span>
        <span class="tier-badge" id="p2-wall-tier">城防：無</span>
        <span class="tier-badge weapon-badge" id="p2-weapon-tier">武器：無</span>
        <span class="stats-tag" id="p2-stats-tag">旗:0 | 盾:0 | 威:0</span>
      </div>

      <div class="camp-battle-row">
        <!-- 獨立西翼軍火 -->
        <div class="weapon-bay-column">
          <div class="weapon-bay-header">西翼軍火</div>
          <div id="p2-weapons-left" style="display:flex; flex-direction:column; gap:2px; align-items:center;"></div>
        </div>

        <!-- 中央要塞與防護罩專區 (防護罩全面罩頂覆蓋旗幟與堡壘) -->
        <div class="fortress-stage">
          <svg class="wall-svg-container" id="p2-wall-svg" viewBox="0 0 320 168"></svg>

          <!-- 旗幟 🚩 (插在田字格頂端) -->
          <div class="flags-container">
            <div class="sketch-flag" id="p2-f1"><div class="pole"></div><div class="triangle"></div></div>
            <div class="sketch-flag" id="p2-f2"><div class="pole"></div><div class="triangle"></div></div>
            <div class="sketch-flag" id="p2-f3"><div class="pole"></div><div class="triangle"></div></div>
          </div>

          <!-- 田字格 天下太平 -->
          <div class="fortress-box">
            <div class="fortress-char" id="p2-c0">天</div>
            <div class="fortress-char" id="p2-c1">下</div>
            <div class="fortress-char" id="p2-c2">太</div>
            <div class="fortress-char" id="p2-c3">平</div>
          </div>
        </div>

        <!-- 獨立東翼軍火 -->
        <div class="weapon-bay-column">
          <div class="weapon-bay-header">東翼軍火</div>
          <div id="p2-weapons-right" style="display:flex; flex-direction:column; gap:2px; align-items:center;"></div>
        </div>
      </div>
    </div>

    <!-- =========================================================
         中央楚河漢界：問題與選項專屬區 (純粹題文字與按鈕，自動翻轉)
         ========================================================= -->
    <div class="battle-center-divider flip-to-south" id="centralController">

      <!-- 純粹問題卡片與選項列表，無多餘裝飾字句 -->
      <div class="quiz-box" id="quizBox">
        <div class="quiz-question-card">
          <div class="quiz-question-text" id="quizQuestionText">正在載入題目...</div>
        </div>
        <div class="quiz-options-grid" id="quizOptionsGrid"></div>
      </div>

      <!-- 答對後解鎖的行動面板 -->
      <div class="action-panel-inline" id="actionPanelInline">
        <div class="action-panel-title">
          <span id="actionTitleText">🎉 答對獲取算力！請落筆部署：</span>
        </div>
        <div class="action-btns-grid">
          <button id="btnActFlag" class="btn-action-cmd build" onclick="submitAction('flag')">🚩 微調旗(滿3)</button>
          <button id="btnActShield" class="btn-action-cmd build" onclick="submitAction('shield')">🛡️ 安全護欄(3合1)</button>
          <button id="btnActWeapon" class="btn-action-cmd build" onclick="submitAction('weapon')">🚀 越獄提示(3合1)</button>
          <button id="btnActAttack" class="btn-action-cmd atk" onclick="submitAction('attack')">💥 穿透攻擊！</button>
        </div>
      </div>

    </div>

    <!-- 下方陣營 (南方：正立己方視角) -->
    <div class="territory-bottom active-turn" id="p1-territory">
      <div class="camp-battle-row">
        <!-- 獨立西翼軍火 -->
        <div class="weapon-bay-column">
          <div class="weapon-bay-header">西翼軍火</div>
          <div id="p1-weapons-left" style="display:flex; flex-direction:column; gap:2px; align-items:center;"></div>
        </div>

        <!-- 中央要塞與防護罩專區 -->
        <div class="fortress-stage">
          <svg class="wall-svg-container" id="p1-wall-svg" viewBox="0 0 320 168"></svg>

          <!-- 旗幟 (插在田字格頂端) -->
          <div class="flags-container">
            <div class="sketch-flag" id="p1-f1"><div class="pole"></div><div class="triangle"></div></div>
            <div class="sketch-flag" id="p1-f2"><div class="pole"></div><div class="triangle"></div></div>
            <div class="sketch-flag" id="p1-f3"><div class="pole"></div><div class="triangle"></div></div>
          </div>

          <!-- 田字格 天下太平 -->
          <div class="fortress-box">
            <div class="fortress-char" id="p1-c0">天</div>
            <div class="fortress-char" id="p1-c1">下</div>
            <div class="fortress-char" id="p1-c2">太</div>
            <div class="fortress-char" id="p1-c3">平</div>
          </div>
        </div>

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, type = 'sine', duration = 0.12, vol = 0.15) {
      if (isMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

      if (isMuted) return;

    /* ==============================================================
       遊戲狀態管理 (三合一階層合成系統)
       ============================================================== */
    let mode = 'ai'; // 'ai' | 'pvp'
    let currentTurn = 'p1'; // 當前作答方：'p1' (南席) 或 'p2' (北席)
    let currentWinner = null;
    let isFinished = false;
    let currentQuizData = null;

    const state = {
      p1: { flags: 0, shields: { t1: 0, t2: 0, t3: 0 }, weapons: { t1: 0, t2: 0, t3: 0 }, hp: 4 },
      p2: { flags: 0, shields: { t1: 0, t2: 0, t3: 0 }, weapons: { t1: 0, t2: 0, t3: 0 }, hp: 4 }
    };

    function getName(player) {
      if (player === 'p1') {
        return document.getElementById('p1-name-input').value.trim() || '南方陣營';
      } else {
        const val = document.getElementById('p2-name-input').value.trim() || '北方陣營';
        return mode === 'ai' ? `${val} (AI)` : val;
      }
    }

    function updateNames() {
      document.getElementById('p1-title-label').innerText = `${getName('p1')} ${mode === 'ai' ? '(你)' : ''}`;
      document.getElementById('p2-title-label').innerText = getName('p2');
    }

    function getTotalShieldPoints(sh) {
      return (sh.t1 || 0) * 1 + (sh.t2 || 0) * 3 + (sh.t3 || 0) * 9;
    }

    function getAttackPower(wp) {
      const totalUnits = (wp.t1 || 0) * 1 + (wp.t2 || 0) * 3 + (wp.t3 || 0) * 9;
      if (totalUnits === 0) return 0;
      return 1 + Math.floor((totalUnits - 1) / 3) + (wp.t2 * 1) + (wp.t3 * 3);
    }

    function hasAnyShield(sh) {
      return getTotalShieldPoints(sh) > 0;
    }

    function hasAnyWeapon(wp) {
      return (wp.t1 + wp.t2 + wp.t3) > 0;
    }

    function getShieldSummary(sh) {
      const parts = [];
      if (sh.t3 > 0) parts.push(`T3金湯牆×${sh.t3}`);
      if (sh.t2 > 0) parts.push(`T2青石塞×${sh.t2}`);
      if (sh.t1 > 0) parts.push(`T1木柵網×${sh.t1}`);
      return parts.length > 0 ? parts.join(' ') : '城防：無';
    }

    function getWeaponSummary(wp) {
      const parts = [];
      if (wp.t3 > 0) parts.push(`T3巡航艦×${wp.t3}`);
      if (wp.t2 > 0) parts.push(`T2CoT戰機×${wp.t2}`);
      if (wp.t1 > 0) parts.push(`T1輕裝火箭×${wp.t1}`);
      return parts.length > 0 ? parts.join(' ') : '武器：無';
    }

    function setMode(m) {
      mode = m;
      document.getElementById('modeSelect').value = m;
      updateNames();
      resetGame();
    }

    /* 洗牌演算法 (Fisher-Yates) */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* ==============================================================
       問答系統與動態旋轉面板核心邏輯 (純粹題目與選項)
       ============================================================== */
    function loadNewQuiz() {
      if (isFinished) return;
      const rawQuiz = GENAI_QUIZ_BANK[Math.floor(Math.random() * GENAI_QUIZ_BANK.length)];

      // 動態打亂選項順序，保證 A、B、C、D 均勻隨機分佈！
      const shuffledOptions = shuffleArray(rawQuiz.options);
      const correctIdx = shuffledOptions.indexOf(rawQuiz.correct);

      currentQuizData = {
        q: rawQuiz.q,
        options: shuffledOptions,
        ans: correctIdx
      };

      const ctrl = document.getElementById('centralController');

      // 動態旋轉：根據當前作答基地方向切換！
      if (currentTurn === 'p2') {
        ctrl.className = 'battle-center-divider flip-to-north';
      } else {
        ctrl.className = 'battle-center-divider flip-to-south';
      }

      highlightActiveTerritory(currentTurn);

      // 只保留題目與選擇
      document.getElementById('quizQuestionText').innerText = currentQuizData.q;

      const optGrid = document.getElementById('quizOptionsGrid');
      optGrid.innerHTML = '';
      currentQuizData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-quiz-opt';
        btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
        btn.onclick = () => handleAnswer(idx);
        optGrid.appendChild(btn);
      });

      document.getElementById('quizBox').style.display = 'flex';
      document.getElementById('actionPanelInline').style.display = 'none';

      // 若為人機對戰且輪到 AI
      if (mode === 'ai' && currentTurn === 'p2') {
        disableQuizBtns(true);
        setTimeout(aiAnswerQuiz, 1000);
      } else {
        disableQuizBtns(false);
      }
    }

    function disableQuizBtns(disabled) {
      const btns = document.querySelectorAll('.btn-quiz-opt');
      btns.forEach(b => b.disabled = disabled);
    }

    function handleAnswer(selectedIdx) {
      disableQuizBtns(true);
      const isCorrect = (selectedIdx === currentQuizData.ans);
      const btns = document.querySelectorAll('.btn-quiz-opt');

      if (btns[selectedIdx]) {
        btns[selectedIdx].classList.add(isCorrect ? 'correct' : 'wrong');
      }
      if (!isCorrect && btns[currentQuizData.ans]) {
        btns[currentQuizData.ans].classList.add('correct');
      }

      if (isCorrect) {
        playTone(600, 'triangle', 0.15);
        currentWinner = currentTurn;
        setTimeout(() => openActionPanel(currentWinner), 500);
      } else {
        playTone(220, 'sawtooth', 0.25);
        setTimeout(() => {
          currentTurn = (currentTurn === 'p1') ? 'p2' : 'p1';
          loadNewQuiz();
        }, 1000);
      }
    }

    function aiAnswerQuiz() {
      const willBeCorrect = Math.random() < 0.75;
      const chosen = willBeCorrect ? currentQuizData.ans : ((currentQuizData.ans + 1) % currentQuizData.options.length);
      handleAnswer(chosen);
    }

    /* 答對後開啟行動面板 */
    function openActionPanel(player) {
      document.getElementById('quizBox').style.display = 'none';
      const panel = document.getElementById('actionPanelInline');
      panel.style.display = 'flex';

      const p = state[player];
      const pName = getName(player);
      const atk = getAttackPower(p.weapons);

      document.getElementById('actionTitleText').innerText = `🎉【${pName}】獲取算力！請落筆部署：`;

      const btnFlag = document.getElementById('btnActFlag');
      const btnShield = document.getElementById('btnActShield');
      const btnWeapon = document.getElementById('btnActWeapon');
      const btnAttack = document.getElementById('btnActAttack');

      btnFlag.disabled = (p.flags >= 3);
      btnFlag.innerText = (p.flags >= 3) ? '🚩 微調滿(3/3)' : `🚩 微調旗(${p.flags}/3)`;

      btnShield.disabled = (p.flags < 3);
      btnWeapon.disabled = !hasAnyShield(p.shields);
      btnAttack.disabled = !hasAnyWeapon(p.weapons);
      btnAttack.innerText = hasAnyWeapon(p.weapons) ? `💥 穿透攻擊(威:${atk})` : '💥 穿透攻擊！';

      if (mode === 'ai' && player === 'p2') {
        setTimeout(aiDecideAction, 900);
      }
    }

    function submitAction(type) {
      executeAction(currentWinner, type);
    }

    /* AI 行動決策邏輯 */
    function aiDecideAction() {
      const ai = state.p2;
      const player = state.p1;
      let act = 'flag';

      if (ai.flags < 3) {
        act = 'flag';
      } else if (!hasAnyShield(ai.shields)) {
        act = 'shield';
      } else if (!hasAnyWeapon(ai.weapons)) {
        act = 'weapon';
      } else {
        const r = Math.random();
        const pShieldPts = getTotalShieldPoints(player.shields);
        if (pShieldPts === 0 && r < 0.8) {
          act = 'attack';
        } else if (getTotalShieldPoints(ai.shields) < 3 && r < 0.45) {
          act = 'shield';
        } else if (r < 0.65) {
          act = 'weapon';
        } else {
          act = 'attack';
        }
      }
      executeAction('p2', act);
    }

    /* ==============================================================
       合成升級與行動結算
       ============================================================== */
    function checkShieldSynthesize(sh) {
      let upgraded = false;
      while (sh.t1 >= 3) {
        sh.t1 -= 3;
        sh.t2 = (sh.t2 || 0) + 1;
        upgraded = true;
      }
      while (sh.t2 >= 3) {
        sh.t2 -= 3;
        sh.t3 = (sh.t3 || 0) + 1;
        upgraded = true;
      }
      if (upgraded) playUpgradeFanfare();
    }

    function checkWeaponSynthesize(wp) {
      let upgraded = false;
      while (wp.t1 >= 3) {
        wp.t1 -= 3;
        wp.t2 = (wp.t2 || 0) + 1;
        upgraded = true;
      }
      while (wp.t2 >= 3) {
        wp.t2 -= 3;
        wp.t3 = (wp.t3 || 0) + 1;
        upgraded = true;
      }
      if (upgraded) playUpgradeFanfare();
    }

    function absorbShieldDamage(sh) {
      if (sh.t1 > 0) {
        sh.t1--;
        return true;
      } else if (sh.t2 > 0) {
        sh.t2--;
        sh.t1 += 2;
        return true;
      } else if (sh.t3 > 0) {
        sh.t3--;
        sh.t2 += 2;
        return true;
      }
      return false;
    }

    function executeAction(actorKey, action) {
      const targetKey = (actorKey === 'p1') ? 'p2' : 'p1';
      const actor = state[actorKey];
      const target = state[targetKey];

      if (action === 'flag') {
        actor.flags++;
        playTone(520, 'sine', 0.15);
      } else if (action === 'shield') {
        actor.shields.t1 = (actor.shields.t1 || 0) + 1;
        playTone(480, 'sine', 0.16);
        checkShieldSynthesize(actor.shields);
      } else if (action === 'weapon') {
        actor.weapons.t1 = (actor.weapons.t1 || 0) + 1;
        playTone(720, 'sine', 0.2);
        checkWeaponSynthesize(actor.weapons);
      } else if (action === 'attack') {
        playTone(130, 'square', 0.35, 0.3);
        const pwr = getAttackPower(actor.weapons);

        for (let i = 0; i < pwr; i++) {
          const absorbed = absorbShieldDamage(target.shields);
          if (absorbed) {
            continue;
          } else if (target.flags > 0) {
            target.flags--;
          } else if (target.hp > 0) {
            target.hp--;
          }
        }
      }

      render();
      checkWin();

      if (!isFinished) {
        currentTurn = (currentTurn === 'p1') ? 'p2' : 'p1';
        currentWinner = null;
        setTimeout(loadNewQuiz, 500);
      }
    }

    function highlightActiveTerritory(player) {
      document.getElementById('p1-territory').classList.toggle('active-turn', player === 'p1');
      document.getElementById('p2-territory').classList.toggle('active-turn', player === 'p2');
    }

    /* ==============================================================
       防護罩渲染：弧度高於旗幟尖端，徹底自上而下罩住田字格與旗幟！
       ============================================================== */
    function renderCastleWalls(svgId, sh) {
      const svg = document.getElementById(svgId);
      svg.innerHTML = '';
      if (!hasAnyShield(sh)) return;

      const centerX = 160;
      const baseY = 162;

      let layerIdx = 0;

      // 1. T1 木柵欄 (手繪直立木樁籬笆，弧度完全罩頂)
      for (let i = 0; i < sh.t1; i++) {
        layerIdx++;
        const rx = 62 + layerIdx * 10;
        const ry = 126 + layerIdx * 8;

        const fenceArc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        fenceArc.setAttribute('d', `M ${centerX - rx} ${baseY} A ${rx} ${ry} 0 0 1 ${centerX + rx} ${baseY}`);
        fenceArc.setAttribute('fill', 'none');
        fenceArc.setAttribute('stroke', '#8b5a2b');
        fenceArc.setAttribute('stroke-width', '2.2');
        svg.appendChild(fenceArc);

        const stakesCount = 16;
        let stakesD = '';
        for (let s = 1; s <= stakesCount - 1; s++) {
          const ang = Math.PI - (s / stakesCount) * Math.PI;
          const px = centerX + rx * Math.cos(ang);
          const py = baseY - ry * Math.sin(ang);
          const pTopX = centerX + (rx + 6) * Math.cos(ang);
          const pTopY = baseY - (ry + 6) * Math.sin(ang);
          stakesD += ` M ${px} ${py} L ${pTopX} ${pTopY}`;
        }
        const stakesPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        stakesPath.setAttribute('d', stakesD);
        stakesPath.setAttribute('stroke', '#6e4720');
        stakesPath.setAttribute('stroke-width', '2.2');
        stakesPath.setAttribute('stroke-linecap', 'round');
        svg.appendChild(stakesPath);
      }

      // 2. T2 青石要塞牆 (石塊縫隙 + 垛口齒網)
      for (let i = 0; i < sh.t2; i++) {
        layerIdx++;
        const rx = 68 + layerIdx * 12;
        const ry = 132 + layerIdx * 10;

        const stoneWall = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        stoneWall.setAttribute('d', `M ${centerX - rx} ${baseY} A ${rx} ${ry} 0 0 1 ${centerX + rx} ${baseY}`);
        stoneWall.setAttribute('fill', 'none');
        stoneWall.setAttribute('stroke', '#2c3e50');
        stoneWall.setAttribute('stroke-width', '4');
        svg.appendChild(stoneWall);

        const brickLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        brickLine.setAttribute('d', `M ${centerX - (rx - 3)} ${baseY} A ${rx - 3} ${ry - 3} 0 0 1 ${centerX + (rx - 3)} ${baseY}`);
        brickLine.setAttribute('fill', 'none');
        brickLine.setAttribute('stroke', '#95a5a6');
        brickLine.setAttribute('stroke-width', '1.8');
        brickLine.setAttribute('stroke-dasharray', '4, 4');
        svg.appendChild(brickLine);

        const teethCount = 18;
        let crenD = '';
        for (let t = 1; t <= teethCount - 1; t++) {
          const ang = Math.PI - (t / teethCount) * Math.PI;
          const px = centerX + rx * Math.cos(ang);
          const py = baseY - ry * Math.sin(ang);
          const pxOut = centerX + (rx + 7) * Math.cos(ang);
          const pyOut = baseY - (ry + 7) * Math.sin(ang);
          crenD += ` M ${px} ${py} L ${pxOut} ${pyOut}`;
        }
        const crenPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        crenPath.setAttribute('d', crenD);
        crenPath.setAttribute('stroke', '#1e272e');
        crenPath.setAttribute('stroke-width', '2.5');
        svg.appendChild(crenPath);
      }

      // 3. T3 鋼鐵金湯要塞 (深黑重甲護城垣 + 反擊刺針)
      for (let i = 0; i < sh.t3; i++) {
        layerIdx++;
        const rx = 74 + layerIdx * 14;
        const ry = 138 + layerIdx * 11;

        const steelWall = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        steelWall.setAttribute('d', `M ${centerX - rx} ${baseY} A ${rx} ${ry} 0 0 1 ${centerX + rx} ${baseY}`);
        steelWall.setAttribute('fill', 'none');
        steelWall.setAttribute('stroke', '#111');
        steelWall.setAttribute('stroke-width', '6');
        svg.appendChild(steelWall);

        const goldCoil = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        goldCoil.setAttribute('d', `M ${centerX - (rx + 2)} ${baseY} A ${rx + 2} ${ry + 2} 0 0 1 ${centerX + (rx + 2)} ${baseY}`);
        goldCoil.setAttribute('fill', 'none');
        goldCoil.setAttribute('stroke', '#d35400');
        goldCoil.setAttribute('stroke-width', '2.2');
        goldCoil.setAttribute('stroke-dasharray', '6, 4');
        svg.appendChild(goldCoil);

        const spikesCount = 20;
        let spikeD = '';
        for (let k = 1; k <= spikesCount - 1; k++) {
          const ang = Math.PI - (k / spikesCount) * Math.PI;
          const px = centerX + rx * Math.cos(ang);
          const py = baseY - ry * Math.sin(ang);
          const pxFar = centerX + (rx + 10) * Math.cos(ang);
          const pyFar = baseY - (ry + 10) * Math.sin(ang);
          spikeD += ` M ${px} ${py} L ${pxFar} ${pyFar}`;
        }
        const spikePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        spikePath.setAttribute('d', spikeD);
        spikePath.setAttribute('stroke', '#c0392b');
        spikePath.setAttribute('stroke-width', '2.5');
        svg.appendChild(spikePath);
      }
    }

    /* 武器庫手繪造型 */
    function getWeaponSVG(tier) {
      if (tier === 1) {
        return `
          <div class="weapon-unit-wrap">
            <svg class="weapon-svg" viewBox="0 0 42 56" width="30" height="40">
              <rect x="13" y="18" width="16" height="26" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <polygon points="21,4 11,18 31,18" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <polygon points="13,32 3,46 13,46" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <polygon points="29,32 39,46 29,46" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
            </svg>
            <span class="weapon-tag-pill" style="color:#2980b9;">T1火箭</span>
          </div>
        `;
      } else if (tier === 2) {
        return `
          <div class="weapon-unit-wrap">
            <svg class="weapon-svg" viewBox="0 0 54 68" width="38" height="48">
              <rect x="10" y="18" width="12" height="30" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <rect x="30" y="18" width="12" height="30" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <polygon points="16,5 8,18 24,18" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <polygon points="36,5 28,18 44,18" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <polygon points="10,32 1,46 10,44" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
              <polygon points="42,32 51,46 42,44" fill="#fff" stroke="#1e1e1e" stroke-width="2.5" />
            </svg>
            <span class="weapon-tag-pill" style="color:#d35400;">💥T2戰機</span>
          </div>
        `;
      } else {
        return `
          <div class="weapon-unit-wrap">
            <svg class="weapon-svg" viewBox="0 0 64 80" width="44" height="54">
              <rect x="22" y="14" width="20" height="44" fill="#fff" stroke="#111" stroke-width="3" />
              <polygon points="32,2 20,14 44,14" fill="#fff" stroke="#111" stroke-width="3" />
              <rect x="8" y="24" width="10" height="30" fill="#fff" stroke="#111" stroke-width="2.5" />
              <polygon points="13,15 7,24 19,24" fill="#fff" stroke="#111" stroke-width="2.5" />
              <rect x="46" y="24" width="10" height="30" fill="#fff" stroke="#111" stroke-width="2.5" />
              <polygon points="51,15 45,24 57,24" fill="#fff" stroke="#111" stroke-width="2.5" />
              <line x1="32" y1="20" x2="32" y2="44" stroke="#8e44ad" stroke-width="2" stroke-dasharray="3,3" />
            </svg>
            <span class="weapon-tag-pill" style="color:#8e44ad;">☄️T3重炮</span>
          </div>
        `;
      }
    }

    function renderFlankWeapons(leftId, rightId, wp) {
      const leftBox = document.getElementById(leftId);
      const rightBox = document.getElementById(rightId);
      leftBox.innerHTML = '';
      rightBox.innerHTML = '';

      const list = [];
      for (let i = 0; i < wp.t3; i++) list.push(3);
      for (let i = 0; i < wp.t2; i++) list.push(2);
      for (let i = 0; i < wp.t1; i++) list.push(1);

      list.forEach((tier, idx) => {
        const html = getWeaponSVG(tier);
        if (idx % 2 === 0) {
          leftBox.insertAdjacentHTML('beforeend', html);
        } else {
          rightBox.insertAdjacentHTML('beforeend', html);
        }
      });
    }

    /* 全局渲染 */
    function render() {
      // 玩家 1 (南方)
      const p1 = state.p1;
      const p1Atk = getAttackPower(p1.weapons);
      const p1Pts = getTotalShieldPoints(p1.shields);
      document.getElementById('p1-stats-tag').innerText = `旗:${p1.flags}/3 | 盾:${p1Pts}點 | 威:${p1Atk}`;
      document.getElementById('p1-wall-tier').innerText = getShieldSummary(p1.shields);
      document.getElementById('p1-weapon-tier').innerText = getWeaponSummary(p1.weapons);
      for (let i = 1; i <= 3; i++) {
        document.getElementById(`p1-f${i}`).classList.toggle('drawn', p1.flags >= i);
      }
      renderCastleWalls('p1-wall-svg', p1.shields);
      renderFlankWeapons('p1-weapons-left', 'p1-weapons-right', p1.weapons);
      for (let i = 0; i < 4; i++) {
        document.getElementById(`p1-c${i}`).classList.toggle('struck', i >= p1.hp);
      }

      // 玩家 2 (北方，180度倒置)
      const p2 = state.p2;
      const p2Atk = getAttackPower(p2.weapons);
      const p2Pts = getTotalShieldPoints(p2.shields);
      document.getElementById('p2-stats-tag').innerText = `旗:${p2.flags}/3 | 盾:${p2Pts}點 | 威:${p2Atk}`;
      document.getElementById('p2-wall-tier').innerText = getShieldSummary(p2.shields);
      document.getElementById('p2-weapon-tier').innerText = getWeaponSummary(p2.weapons);
      for (let i = 1; i <= 3; i++) {
        document.getElementById(`p2-f${i}`).classList.toggle('drawn', p2.flags >= i);
      }
      renderCastleWalls('p2-wall-svg', p2.shields);
      renderFlankWeapons('p2-weapons-left', 'p2-weapons-right', p2.weapons);
      for (let i = 0; i < 4; i++) {
        document.getElementById(`p2-c${i}`).classList.toggle('struck', i >= p2.hp);
      }
    }

    function checkWin() {
      if (state.p1.hp <= 0) {
        isFinished = true;
        announceWinner(getName('p2'));
      } else if (state.p2.hp <= 0) {
        isFinished = true;
        announceWinner(getName('p1'));
      }
    }

    function announceWinner(name) {
      document.getElementById('endWinner').innerText = `🏆 ${name} 統一天下！`;
      document.getElementById('endModal').classList.add('show');
    }

    function resetGame() {
      state.p1 = { flags: 0, shields: { t1: 0, t2: 0, t3: 0 }, weapons: { t1: 0, t2: 0, t3: 0 }, hp: 4 };
      state.p2 = { flags: 0, shields: { t1: 0, t2: 0, t3: 0 }, weapons: { t1: 0, t2: 0, t3: 0 }, hp: 4 };
      isFinished = false;
      currentTurn = 'p1';
      currentWinner = null;

      document.getElementById('endModal').classList.remove('show');
      render();
      loadNewQuiz();
    }

    window.onload = () => {
      updateNames();
      render();
      loadNewQuiz();
    };
  </script>
</body>
